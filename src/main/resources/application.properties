spring.application.name=profilev2rest
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/make_profile 
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

logging.level.com.make_profile=error
spring.datasource.hikari.enabled=false
spring.jpa.properties.hibernate.show_sql=OFF
logging.level.org.hibernate=error
logging.level.com.zaxxer.hikari=error

spring.main.allow-circular-references=true

#mail configuration
spring.mail.host=smtp.zoho.in
spring.mail.port=587
spring.mail.username=contact@gracefultechnologies.com
spring.mail.password=Graceful@2020
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.from=contact@gracefultechnologies.com

 
spring.security.oauth2.client.registration.google.scope=profile,email

server.forward-headers-strategy=framework

# Disable OpenAPI JSON endpoints
springdoc.api-docs.enabled=false

# Disable Swagger UI
springdoc.swagger-ui.enabled=false

spring.rabbitmq.dynamic=false

#spring.rabbitmq.host=localhost
#spring.rabbitmq.port=5672
#spring.rabbitmq.username=guest
#spring.rabbitmq.password=guest

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=make_profiles
spring.rabbitmq.password=graceful2020

spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=5
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.acknowledge-mode=manual


